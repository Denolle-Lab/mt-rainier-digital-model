  n_s: 1280
  n_stations: 50
  pick_sigma_s:
    P: 0.14
    S: 0.23
method:
  forward: S4 + S5 in memory (properties.assign, fusion.build) on the S6 grid (dx
    500 m); pykonal PointSourceSolver by reciprocity; air above DEM + 1 cell(s) at
    343.0 m/s
  location: L1 grid search below the DEM, then Huber Gauss-Newton with a ground penalty
  derivatives: 'geology: finite differences (h = 0.05) through S4 + S5; regional bias:
    rays'
  separation: Pavlis & Booker (1980), per event
  lam_s_rel: 0.1
  lam_d_rel: 0.01
  iterations_fitting_half: 3
  iterations_all: 2
  geology_derivatives: recomputed every fitting-half iteration, reused in the all-events
    run
  split: events alternating in origin-time order
