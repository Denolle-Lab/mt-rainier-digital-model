# The platform (3D viewer bundle and atlas) is rebuilt from scratch by `pixi run platform` (scripts/32_platform.py):
# derived files are deleted, then every step reads only data/raw/ (checksummed in docs/data_manifest.csv) and the
# model products in data/processed/ and outputs/, which the rebuild does not recompute.

# Data freeze. Live services are queried up to this date (stations, FDSN channel epochs, ComCat events), and a
# sensor counts as operating if its last epoch ends after it. Advancing it is a deliberate data release.
as_of: "2026-09-23"

# Inputs that exist only on a project machine. `stage` copies each one once from `from` into data/raw/<to>; every
# step then reads the copy, so a rebuild on another machine needs only data/raw/.
local_inputs:
  das_channels:
    to: das/Paradise2NisquallyEntrace_Channels.csv
    from: ~/Downloads/Paradise2NisquallyEntrace_Channels.csv
  smart_sensing_stations:
    to: smart_sensing/stations
    from: ~/GitHub/mt-rainier-smart-sensing/data/stations
  usgs_i432_kmz:
    to: overlays/USGS_I-432_1.kmz
    from: ~/Downloads/USGS_I-432_1.kmz
  soil_map_kmz:
    to: overlays/soilmap_mtrainier_modified_super_overlay.kmz
    from: ~/Downloads/soilmap_mtrainier_modified_super_overlay.kmz

viewer:
  atlas: web/viewer/site/public/atlas
  derived: [web/viewer/site/public/atlas, web/atlas/data]   # deleted before every rebuild
  cache: data/raw/viewer_cache
  events: [dec2025_ar]                                       # S29 events written into the bundle
  bundle: outputs/viewer-atlas-bundle.tar.gz
