  n_events: 88
  n_p: 1823
  n_s: 1280
  n_stations: 50
  hypocentres: relocated in 3D at every iteration (S13); catalogue locations only
    as starting points
  pick_sigma_s:
    P: 0.14
    S: 0.23
method:
  solver: pykonal PointSourceSolver, reciprocity (one field per station and phase)
  grid_dx_m: 500
  location: L1 grid search +-15 km around the catalogue epicentre, then Huber Gauss-Newton
    (k = 1.5 sigma, picks beyond 5.0 sigma rejected)
  derivatives: ray integrals down grad T (step dx/4)
  separation: Pavlis & Booker (1980), per event
  lam_s_rel: 0.1
  lam_d_rel: 0.01
  iterations_fitting_half: 4
  iterations_all: 3
  split: events alternating in origin-time order
