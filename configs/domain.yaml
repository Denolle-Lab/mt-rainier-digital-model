# The model domain: ONE definition, read by every stage (rainier3d.config.domain).
# Authoritative in projected coordinates. The lon/lat box it derives from is
# (-122.30, 46.50, -121.40, 47.15), the mt-rainier-smart-sensing BBOX, projected to
# EPSG:32610 and snapped OUTWARD to whole kilometres. It covers the park and the WRSZ.

name: rainier-v0
crs: EPSG:32610          # UTM 10N, WGS84
vertical_datum: EPSG:5703  # NAVD88 height; elevation positive up, metres
bounds_utm: [553000, 5149000, 623000, 5224000]   # x0, y0, x1, y1 (70 x 75 km)
summit_lonlat: [-121.7603, 46.8523]               # Columbia Crest, 4392 m

# Resolution profiles. "m1" is the coarse skeleton; "full" is the plan target.
profile: m1
profiles:
  m1:
    surface_res_m: 100
    levels:
      L1: {dx: 250, dz: 50,  z_top: 4400,   z_bot: 0}
      L2: {dx: 500, dz: 250, z_top: 0,      z_bot: -6000}
      L3: {dx: 1000, dz: 1000, z_top: -6000, z_bot: -20000}
  full:
    surface_res_m: 10
    levels:
      L1: {dx: 50,  dz: 20,  z_top: 4400,   z_bot: 0}
      L2: {dx: 200, dz: 100, z_top: 0,      z_bot: -6000}
      L3: {dx: 500, dz: 500, z_top: -6000,  z_bot: -20000}

paths:
  data: data                 # gitignored local cache
  raw: data/raw
  processed: data/processed
  outputs: outputs

# Fusion with the regional model (S5).
fusion:
  # Cutoff wavelength (m) of the low-pass applied to the regional model, by depth below the
  # local surface (m). Placeholder values: set to the regional model's resolution length.
  lambda_c_by_depth: [[0, 6000], [2000, 10000], [10000, 20000]]
  geology_only_depth_m: 300   # above this depth the geology model is used as is
  taper_depth_m: 1000         # linear taper to the blended model between the two depths
  # Vertical cutoff wavelength (m) of the geology: flat-lying contacts (edifice base, cap base) spread over ~1 km
  # instead of one 50 m cell. Placeholder: two cells of the 500 m eikonal grid (validation.dx). Applied to the
  # cells entirely below lambda_z_from_depth_m, the base of the critical-zone columns (configs/cz.yaml
  # medium.fine_base_m), with a cutoff growing from 0 there to lambda_z_m 250 m deeper (rainier3d.fusion.blend).
  lambda_z_m: 1000
  lambda_z_from_depth_m: 150
  # Horizontal cutoff (m) of the geology below lambda_z_from_depth_m: map units extruded to depth end in vertical
  # walls; the cutoff grows as lambda_h_growth x depth below the critical-zone base, to lambda_h_m (placeholders:
  # 2 km at 2 km depth, below the node spacing of the S37 tomography, which then sets the contrasts it resolves).
  lambda_h_m: 2000
  lambda_h_growth: 1.0
  lowpass_rms_tol: 0.03       # RMS of ln V between LP(fused) and LP(regional); invariant test

# Eikonal grid for the PNSN check (S6).
validation:
  dx: 500
  z_top: 4500
  z_bot: -30000
  min_magnitude: 2.0
  start: "2015-01-01"
  end: "2026-09-01"

# Local-earthquake tomography (S37, rainier3d.validate.tomo): ln Vp and ln Vs perturbations of the fused model.
# Placeholders: node spacing between the station spacing (~5 km) and the 500 m eikonal grid; depth nodes in m below
# sea level, denser where the earthquakes are (0-15 km).
tomography:
  node_dx_m: 3000
  node_depths_m: [-3000, 0, 2000, 4000, 6000, 9000, 13000, 18000, 25000]
  # PNSN picks: the S13 validation events plus these catalogue caches (data/raw/pnsn/<name>, rainier3d.catalog.fetch)
  pick_caches: [catalog_2023_2025_m1, catalog_2015-01-01_2026-09-23_m0.5]
  held_out: blocks                # blocks (alternate squares of epicentres) or alternate (every other event in time)
  held_out_block_m: 10000
  iterations: 6                   # at most; a step is kept only if the relocated held-out misfit falls
  stop_rel_tol: 0.005             # by more than 0.5% (full step, else half step; otherwise stop)
  lam_s: [3.0, 10.0, 30.0, 100.0, 300.0, 1000.0]   # smoothing, relative to the mean squared column norm; chosen on held-out events
  lam_d: 0.03                     # damping towards the starting model, same scale
  skin: 1                         # rock cells above the DEM, as in S13
  checkerboard_cells_m: [6000, 12000]
  checkerboard_amp: 0.05
  dws_min_m: 5000                 # ray length (weighted) below which a node counts as unsampled
