# Raster overlays for the atlas and the 3D scene. KMZ ground overlays are converted by
# rainier3d.io.kmz; crop is [left, top, right, bottom] as fractions of the mosaic, applied before
# georeferencing is recomputed (the crop keeps the original lon/lat scale).

i432:
  label: Geology, USGS I-432 (Fiske et al. 1963)
  local_input: usgs_i432_kmz        # configs/platform.yaml: staged into data/raw/overlays/
  source_key: fiske_1963
  registration: KMZ LatLonBox from the USGS NGMDB product (quadrangle corners)
  opacity: 0.75
  jpeg: true

soil:
  label: General soil map, MORA (NRCS/NPS poster)
  local_input: soil_map_kmz
  # The KMZ is the whole poster (title, legend, insets) placed over a lon/lat box by hand in
  # Google Earth. The crop keeps the map panel only; registration is approximate (order 100s of m).
  crop: [0.085, 0.045, 0.925, 0.595]
  registration: approximate, hand-placed poster (see note)
  opacity: 0.7
  white_transparent: true   # poster background outside the park boundary

model_geology:
  label: Model surface units (DNR GeMS 1:100k crosswalk)
  from: surface.zarr/surface_unit
  opacity: 0.6
