# Source registry. Every layer's gaia:source resolves through a key here.
# verified: "web-2026-09-23" = the citation/URL was confirmed during the 2026-09-23 literature
# survey; "no" = from memory or partial evidence, check before citing in a paper.
# role: what the source constrains in this model.

dnr_gems_100k:
  title: Washington Geological Survey 1:100,000 surface geology (GeMS), map units, orientations, faults
  url: https://gis.dnr.wa.gov/site1/rest/services/Public_Geology/100K_Surface_Geology_WA_GeMS/FeatureServer
  license: public (WA DNR)
  verified: web-2026-09-23
  role: surface lithology (layer 11), description of map units (layer 13); orientations (layer 1) for M3

nps_gri_mora:
  title: NPS GRI Digital Geologic-GIS Map of Mount Rainier National Park (after Fiske et al. 1963)
  url: https://data.doi.gov/dataset/digital-geologic-gis-map-of-mount-rainier-national-park-washington-nps-grd-gri-mora-mora-g
  license: public domain
  verified: web-2026-09-23
  role: park bedrock units at 1:62,500; not ingested in M1 (download link not scripted yet)

fiske_1963:
  title: Fiske, Hopson & Waters 1963, Geology of Mount Rainier National Park, USGS PP 444
  url: https://pubs.usgs.gov/pp/0444/report.pdf
  doi: 10.3133/pp444
  verified: web-2026-09-23
  role: stratigraphy and unit thicknesses of the pre-volcanic basement

rainier_dem_smart_sensing:
  title: 3DEP DEM mosaic cached by mt-rainier-smart-sensing (py3dep), EPSG:5070, ~8.3 m
  url: file://~/GitHub/mt-rainier-smart-sensing/data/dem/rainier_dem.tif
  license: public domain (USGS 3DEP)
  verified: local file read 2026-09-23 (max 4392.4 m)
  role: M1 DEM; replaced by 3DEP 1 m / MORA 2021 SfM in M2

usgs_3dep:
  title: USGS 3D Elevation Program
  url: https://www.usgs.gov/3d-elevation-program
  license: public domain
  verified: web-2026-09-23
  role: DEM

cvm17:
  title: Wirth, Grant, Stone, Stephenson & Frankel 2025, Cascadia velocity model v1.7 with shallow soils and topography, USGS OFR 2025-1045
  doi: 10.5066/P14HJ3IC
  article_doi: 10.3133/ofr20251045
  license: public domain
  verified: web-2026-09-23
  local: ~/GitHub/gwl-space-time-smooth/data/raw/CVM17_L01.nc, CVM17_L2.nc (L3 not downloaded)
  note: >-
    z is depth below the ground surface in L01 (verified in gwl-space-time-smooth from the median
    top-sample Vs of ~206 m/s). L2 is taken as the same convention: at the summit Vs runs
    2841 m/s at z=1200 (L01) and 2870 m/s at z=1500 (L2), which is continuous; checked 2026-09-23.
  role: regional Vp, Vs to 9.9 km depth; long wavelengths in S5

crescent_gen0:
  title: He et al. 2026, The CRESCENT Generation 0 Cascadia Community Velocity Model, JGR Solid Earth
  doi: 10.1029/2025JB033216
  data_doi: 10.6084/m9.figshare.31902061
  verified: web-2026-09-23 (citation); local file ~/GitHub/cascadia_obs_ensemble/data/tomography/CRESCENT_Gen0.nc
  note: depth coordinate -4 to 100 km, negative above sea level (taken as km below sea level)
  role: regional Vs and Vs uncertainty below the CVM L2 base (9.9 km)

pnsn_1d_wa:
  title: PNSN 1D velocity model, western Washington, as tabulated in cascadia_obs_ensemble/data/vel_pnsn_wa.csv
  url: file://~/GitHub/cascadia_obs_ensemble/data/vel_pnsn_wa.csv
  verified: "no: which PNSN model this is (P3 Puget Sound or C3 Cascades) is not documented in the file; ask PNSN"
  role: 1D reference for S6

pnsn_quarterly_2003a:
  title: PNSN Quarterly Report 2003-A (lists regional 1D model codes P3, C3, S3, ...)
  url: https://assets.pnsn.org/legacy_reports/Sum03/Quarterly2003A.pdf
  verified: web-2026-09-23
  role: model naming

comcat_uw:
  title: USGS ComCat, PNSN (uw) origins and phase-data QuakeML
  url: https://earthquake.usgs.gov/fdsnws/event/1/
  verified: web-2026-09-23 (89 M>=2 events in domain 2015-2026 with phase-data)
  role: analyst picks and PNSN hypocentres for S6

fdsn_iris_stations:
  title: EarthScope (IRIS) FDSN station service
  url: https://service.iris.edu/fdsnws/station/1/
  verified: web-2026-09-23
  role: station coordinates for S6

brocher_2005:
  title: Brocher 2005, Empirical relations between elastic wavespeeds and density in the Earth's crust, BSSA 95(6)
  doi: 10.1785/0120050077
  verified: "no: DOI from survey memory; relations coded from the paper's Eqs. 1, 6 and 9"
  role: Vp->Vs, Vp->density (Nafe-Drake) fill-in relations

moran_1999:
  title: Moran, Lees & Malone 1999, P wave crustal velocity structure in the greater Mount Rainier area from local earthquake tomography, JGR 104
  doi: 10.1029/1999JB900036
  verified: web-2026-09-23
  role: low-Vp body 5-18 km beneath the summit; geometry of the M1 magma-body ellipsoid

pang_2025:
  title: Pang, Abers, Moran & Thelen 2025, Nature Geoscience 18
  doi: 10.1038/s41561-024-01630-y
  verified: web-2026-09-23
  role: upper-crustal low-velocity bodies beneath Cascade volcanoes

finn_2001:
  title: Finn, Sisson & Deszcz-Pan 2001, Aerogeophysical measurements of collapse-prone hydrothermally altered zones at Mount Rainier volcano, Nature 409
  doi: 10.1038/35054533
  verified: web-2026-09-23
  role: extent of altered rock; M1 alteration field is a placeholder to be replaced by these grids

rystrom_2000:
  title: Rystrom, Finn & Deszcz-Pan 2000, High resolution, low altitude aeromagnetic and electromagnetic survey of Mt Rainier, USGS Open-File Report 00-027
  doi: 10.3133/ofr200027
  url: https://pubs.usgs.gov/of/2000/ofr-00-0027/data/
  license: public domain (USGS)
  verified: web-2026-09-24 (grids and flight lines downloaded; registration checked against topography and ice)
  role: apparent resistivity (33 kHz, 4737 Hz, 4341 Hz, 837 Hz) and reduced-to-pole magnetic grids for the alteration field (S22)

john_2008:
  title: John, Sisson, Breit, Rye & Vallance 2008, JVGR, hydrothermal alteration at Mount Rainier
  doi: 10.1016/j.jvolgeores.2008.04.004
  verified: web-2026-09-23
  role: conduit-centred alteration geometry

m1_placeholder:
  title: M1 placeholder parameter (author judgement), to be replaced from the literature in M3
  verified: "n/a"
  role: marks every number that is not yet sourced

