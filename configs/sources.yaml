usgs_i432_kmz:
  title: USGS I-432 KMZ, Geologic map and section of Mount Rainier National Park, sheet 1 (Fiske et al. 1963), NGMDB product 1268
  url: file://~/Downloads/USGS_I-432_1.kmz
