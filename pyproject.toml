[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainier3d"
version = "0.1.0"
description = "Open, python-native 3D Earth model of Mount Rainier: surface layers, geology, and Vp/Vs/density/Q"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [{ name = "Marine Denolle", email = "mdenolle@uw.edu" }]
# the client (rainier3d.api and the rainier3d command); the pipeline needs the full pixi environment
dependencies = [
  "numpy",
  "pandas",
  "xarray>=2025.1",
  "zarr>=3",
  "pyproj",
  "requests",
  "netCDF4",
  "scipy",
  "rioxarray",
]

[project.scripts]
rainier3d = "rainier3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rainier3d"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# embedded CSS, HTML and reference strings
"src/rainier3d/report/render.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
