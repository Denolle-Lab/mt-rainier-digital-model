[workspace]
name = "rainier3d"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.12,<3.14"
numpy = ">=2"
scipy = "*"
numba = "*"
pandas = ">=2.2"
xarray = ">=2025.1"
zarr = ">=3"
netcdf4 = "*"
h5netcdf = "*"
dask = "*"
pyyaml = "*"
pyproj = ">=3.6"
rasterio = "*"
rioxarray = "*"
geopandas = ">=1"
shapely = ">=2"
requests = "*"
obspy = ">=1.4"
pyvista = ">=0.45"
trame = "*"
trame-vtk = "*"
trame-vuetify = "*"
meshio = "*"
matplotlib = "*"
pytest = "*"
ruff = "*"
py3dep = ">=0.19.0,<0.20"
trame-pyvista = ">=0.1.1,<0.2"
openpyxl = ">=3.1.5,<4"
markdown = ">=3.10.3,<4"
cmcrameri = ">=1.10,<2"
pynhd = ">=0.20.0,<0.21"
pystac-client = ">=0.9.0,<0.10"
planetary-computer = ">=1.0.0,<2"
odc-stac = ">=0.5.3,<0.6"
harmonica = ">=0.7"

[pypi-dependencies]
rainier3d = { path = ".", editable = true }
fteikpy = ">=2.4"
nest-asyncio2 = ">=1.7.3, <2"
pykonal = ">=0.4.1, <0.5"
h5py = "*"
scikit-fmm = ">=2025.6.23, <2026"

[tasks]
test = "pytest -q tests"
manifest = "python scripts/00_data_manifest.py"
lint = "ruff check src scripts tests"
s1 = "python scripts/01_surface.py"
s2 = "python scripts/02_surface_layers.py"
s3 = "python scripts/03_geomodel.py"
s4 = "python scripts/04_properties.py"
s5 = "python scripts/05_fusion.py"
s6 = "python scripts/06_validate_pnsn.py"
s7 = "python scripts/07_export_viz.py"
viz = "python scripts/07_export_viz.py --show"
s8 = "python scripts/08_atlas.py"
s9 = "python scripts/09_export_grids.py"
s10 = "python scripts/10_report.py"
s11 = "python scripts/11_seismic_atlas.py"
s12 = "python scripts/12_calibrate_vs.py"
s13 = "python scripts/13_joint_calibration.py"
s14 = "python scripts/14_relocate.py"
bib = "python scripts/15_bibliography.py"
s17 = "python scripts/17_gnss_fetch.py"
s18 = "python scripts/18_gnss_strain.py"
# 3D viewer (web/viewer, React + three.js): terrain, stations and quakes from USGS/EarthScope, then S11 model layers
viewer-data = { cmd = "python -m rainier.build --out ../site/public/atlas --cache ../../../data/raw/viewer_cache", cwd = "web/viewer/data" }
viewer-data-test = { cmd = "pytest -q", cwd = "web/viewer/data" }
viewer-bundle = "mkdir -p outputs && tar czf outputs/viewer-atlas-bundle.tar.gz -C web/viewer/site/public atlas"
atlas = "python -m http.server 8765 --bind 127.0.0.1 --directory web/atlas"
all = { depends-on = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8"] }
s22 = "python scripts/22_alteration_finn2001.py"

# Slim environment for the weekly GNSS refresh on GitHub Actions (.github/workflows/gnss-weekly.yml): only what
# S17, S18 (--no-load) and S20 (--only gnss) import. The package runs from src/ without installing it.
[feature.gnss.dependencies]
python = ">=3.12,<3.14"
numpy = ">=2"
scipy = "*"
numba = "*"
pandas = ">=2.2"
pyarrow = "*"
xarray = ">=2025.1"
zarr = ">=3"
netcdf4 = "*"
pyyaml = "*"
pyproj = ">=3.6"
shapely = ">=2"
requests = "*"

[feature.gnss.tasks]
gnss-fetch = { cmd = "python scripts/17_gnss_fetch.py", env = { PYTHONPATH = "src" } }
gnss-strain = { cmd = "python scripts/18_gnss_strain.py", env = { PYTHONPATH = "src" } }
gnss-publish = { cmd = "python scripts/20_publish_products.py --only gnss", env = { PYTHONPATH = "src" } }

[environments]
gnss = { features = ["gnss"], no-default-feature = true }
paper = { features = ["paper"], no-default-feature = true }

# Report build (scripts/23_paper.py, .github/workflows/paper.yml): Pandoc Markdown -> self-contained HTML
# and ESSD LaTeX -> PDF. No model data needed; figures are committed.
[feature.paper.dependencies]
python = ">=3.12,<3.14"
pyyaml = "*"
pandoc = ">=3.8.2,<3.10"   # the range pandoc-crossref 0.3.25 declares on conda-forge
pandoc-crossref = "*"
tectonic = ">=0.15"
graphviz = "*"

[feature.paper.tasks]
paper = "python scripts/23_paper.py"
