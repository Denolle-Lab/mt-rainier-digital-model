name: Weekly GNSS strain refresh

# Pulls the daily GNSS positions again from the original archives (PANGA first, UNR as backup), recomputes
# velocities and strain (S17, S18 without the edifice load), and replaces the assets of the rolling release
# gnss-latest: rainier3d_gnss.zip, its .sha256 and a dated copy rainier3d_gnss_<as_of>.zip. `rainier3d fetch
# gnss` follows that checksum. Pull requests that touch the pipeline run the same steps without uploading.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gnss-weekly.yml"
      - "scripts/17_gnss_fetch.py"
      - "scripts/18_gnss_strain.py"
      - "scripts/20_publish_products.py"
      - "src/rainier3d/geodesy/**"
      - "configs/gnss.yaml"
      - "pixi.toml"
      - "pixi.lock"

permissions:
  contents: write   # release assets

concurrency:
  group: gnss-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: gnss
          locked: true
          cache: true
      - name: S17 fetch (as of today)
        run: pixi run -e gnss gnss-fetch --refresh --as-of today
      - name: S18 velocities and strain
        run: pixi run -e gnss gnss-strain --no-load
      - name: Package (and upload unless this is a pull request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upload=$([ "${{ github.event_name }}" = pull_request ] || echo --upload)
          pixi run -e gnss gnss-publish --tag gnss-latest --rolling $upload
      - name: Summary
        if: always()
        run: |
          {
            echo '### GNSS refresh'
            echo '```json'
            cat data/processed/gnss/fetch.json 2>/dev/null
            python3 -c "import json; s = json.load(open('outputs/gnss/summary.json')); print(json.dumps({k: {m: s['regions'][k][m] for m in ('sites', 'days', 'secular_dilatation_per_yr', 'secular_dilatation_sigma_per_yr')} for k in s['regions']}, indent=1))" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
